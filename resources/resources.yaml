# Resources the site's Resources tab may list. One row per resource, links only.
# Rules and the field list: proposals/2026-10-09-resources-tab.md. Checker: tools/resources/check_resources.py.
#
# Every row that is not a lead has been confirmed by the maintainer. basis person_read_in_browser: the maintainer opened the page
# in a browser and confirmed the row (the Foundation rows on 2026-10-09, "1 to 9 right"; the two Mexican rows on 2026-10-10, in their
# own words). basis script_fetch: the lab's tools loaded the page under its catalog entry's conduct and the maintainer confirmed the
# row on 2026-10-10 on the strength of that screenshot check, without opening each page, and reviews the rows on the site's map.
# The summaries are the lab's own words, written from page titles and headings, not copied from any page.
# who_for is not_checked on every row: nobody has yet recorded who each page says it is for, so the page shows the
# standard line "Check the organisation's page for who can use this" and nothing more.
# A row that is only a lead (a name seen on a slide or in an overview) has basis lead_only and is never confirmed.
# Not here: phone numbers, emails, logos, copied text, individual studies, campaigns, people's names.

